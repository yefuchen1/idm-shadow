[package]
name = "idm-shadow-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IDM Shadow 下载引擎：任务模型、多连接分段、动态重分割、持久化"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "blocking"] }
futures-util = "0.3"
async-trait = "0.1"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
bittorrent-rs = { version = "0.3", features = ["dht", "mse", "lsd", "nat-pmp"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
uuid.workspace = true
