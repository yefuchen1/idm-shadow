[package]
name = "idm-shadow-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IDM Shadow 下载引擎：任务模型、多连接分段、动态重分割、持久化"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
# `system-proxy` 要显式开：`default-features = false` 把它关掉了。
#
# 不开的话 reqwest 不读 Windows 的系统代理设置，
# 用户的浏览器/别的工具走了 Clash 之类的代理，我们这边却直连——
 # 表现就是同一个网址 curl 能下、程序里下不来。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "blocking", "system-proxy"] }
futures-util = "0.3"
async-trait = "0.1"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
bittorrent-rs = { version = "0.3", features = ["dht", "mse", "lsd", "nat-pmp"] }
sha1 = "0.11"
crypto-bigint = { version = "0.5", default-features = false, features = ["alloc"] }
rand = "0.8"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
uuid.workspace = true
