<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>IDM Shadow 设置</title>
    <style>
      body {
        max-width: 520px;
        margin: 24px auto;
        padding: 0 16px;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-weight: 600;
      }
      .hint {
        color: #57606a;
        font-size: 12px;
        margin: 2px 0 0;
      }
      input[type='text'],
      input[type='password'],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row input {
        flex: 1;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        background: #f6f8fa;
        cursor: pointer;
        font: inherit;
      }
      #saved {
        color: #1a7f37;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <h1>IDM Shadow 设置</h1>
    <p class="hint">在 IDM Shadow 主界面的「设置」里可以看到 bridge 地址与 token。</p>

    <label for="bridgeUrl">Bridge 地址</label>
    <input type="text" id="bridgeUrl" placeholder="http://127.0.0.1:16888" />

    <label for="token">Token</label>
    <div class="row">
      <input type="password" id="token" />
      <button id="toggle" type="button">显示</button>
    </div>

    <label for="mode">下载接管方式</label>
    <select id="mode">
      <option value="follow-app">跟随 IDM Shadow 应用设置（推荐）</option>
      <option value="ask">提示后接管（推荐）</option>
      <option value="auto">自动接管</option>
      <option value="off">不接管</option>
    </select>
    <p class="hint">
      「跟随应用」时，桌面应用里勾了「设为默认下载工具」，扩展就自动接管。
      「自动接管」会立刻取消浏览器的下载并交给 IDM Shadow。blob: 开头的下载无法接管，会保留给浏览器。
    </p>

    <label for="autoLaunch">
      <input type="checkbox" id="autoLaunch" />
      应用未启动时自动唤起
    </label>

    <div class="row" style="margin-top: 20px">
      <button id="save" type="button">保存</button>
      <span id="saved"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
