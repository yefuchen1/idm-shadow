<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>IDM Shadow 设置</title>
    <style>
      body {
        max-width: 520px;
        margin: 24px auto;
        padding: 0 16px;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-weight: 600;
      }
      .hint {
        color: #57606a;
        font-size: 12px;
        margin: 2px 0 0;
      }
      input[type='text'],
      input[type='password'],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row input {
        flex: 1;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        background: #f6f8fa;
        cursor: pointer;
        font: inherit;
      }
      #saved {
        color: #1a7f37;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <h1>IDM Shadow 设置</h1>
    <p class="hint">
      一般不用手动填——点下面的「自动配置」就能找到正在运行的
      IDM Shadow，把地址和 token 填好。
    </p>

    <div class="row" style="margin-top: 12px">
      <button id="auto" type="button">自动配置</button>
      <span id="autoMsg"></span>
    </div>

    <label for="bridgeUrl">Bridge 地址</label>
    <input type="text" id="bridgeUrl" placeholder="http://127.0.0.1:16888" />

    <label for="token">Token</label>
    <div class="row">
      <input type="password" id="token" />
      <button id="toggle" type="button">显示</button>
    </div>

    <label for="mode">下载接管方式</label>
    <select id="mode">
      <option value="auto">直接接管（弹出 IDM Shadow 下载对话框）</option>
      <option value="follow-app">跟随 IDM Shadow 应用设置</option>
      <option value="off">不接管</option>
    </select>
    <p class="hint">
      「跟随应用」时，桌面应用里勾了「设为默认下载工具」才接管，否则下载交给浏览器。
      接管后浏览器会立刻取消这次下载，转而弹出 IDM Shadow 自己的下载对话框，
      不会再弹浏览器的通知气泡。接管不了的下载（blob: 地址、本地文件）
      会安静地留给浏览器自己处理。
    </p>

    <label for="autoLaunch">
      <input type="checkbox" id="autoLaunch" />
      应用未启动时自动唤起
    </label>

    <label for="skipImages">
      <input type="checkbox" id="skipImages" />
      跳过图片预览
    </label>
    <p class="hint">
      浏览模型预览站、图库、论坛时，页面里的图片也会被浏览器当成下载。
      勾上这些图片就交给浏览器自己下，不再弹下载对话框。
    </p>

    <div class="row" style="margin-top: 20px">
      <button id="save" type="button">保存</button>
      <span id="saved"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
