<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>IDM Shadow</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c0392b;
        display: inline-block;
        margin-right: 6px;
      }
      .dot.ok {
        background: #27ae60;
      }
      label {
        display: block;
        margin: 8px 0 3px;
        color: #57606a;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 7px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 6px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        background: #f6f8fa;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #eef1f4;
      }
      ul {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        max-height: 190px;
        overflow: auto;
      }
      li {
        padding: 6px 0;
        border-top: 1px solid #eaeef2;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .speed {
        color: #57606a;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      footer {
        margin-top: 10px;
        font-size: 12px;
        color: #57606a;
      }
      footer a {
        color: #0969da;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>IDM Shadow</strong>
      <span id="status"><span class="dot"></span>检测中</span>
    </header>
    <label for="mode">下载接管方式</label>
    <select id="mode">
        <option value="follow-app">跟随应用设置</option>
      <option value="ask">提示后接管</option>
      <option value="auto">自动接管</option>
      <option value="off">不接管</option>
    </select>
    <div class="row">
      <button id="open">打开主界面</button>
      <button id="options">设置</button>
    </div>
    <ul id="tasks"></ul>
    <footer id="summary">—</footer>
    <script src="popup.js"></script>
  </body>
</html>
