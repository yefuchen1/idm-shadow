<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>油猴下载接管测试</title>
    <style>
      body {
        font: 15px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif;
        max-width: 680px;
        margin: 60px auto;
        color: #1c2128;
      }
      button {
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
      }
      #log {
        margin-top: 24px;
        padding: 14px;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-family: Consolas, monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
      code {
        background: #eef1f4;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>油猴下载接管测试</h1>
    <p>
      模拟油猴脚本的下载按钮。点下面的按钮会触发浏览器下载动作，
      如果 IDM Shadow 扩展装了并且接管模式是「自动接管」，
      这个下载会被取消并交给桌面应用处理。
    </p>
    <p>
      触发方式：<code>GM_download()</code> 或 <code>&lt;a download&gt;</code>
      —— 两者最终都走浏览器下载栈，扩展在那一层拦截。
    </p>
    <p>
      <button id="gm">触发 GM_download()</button>
      <button id="anchor">触发 &lt;a download&gt;</button>
    </p>
    <div id="log">等待操作…</div>

    <script>
      const log = (msg) => {
        const el = document.getElementById('log');
        el.textContent = `${new Date().toLocaleTimeString()}  ${msg}\n` + el.textContent;
      };

      // 模拟 Tampermonkey 注入的 GM_download
      window.GM_download = function (url, name) {
        log(`GM_download(${url}, ${name})`);
        const a = document.createElement('a');
        a.href = url;
        if (name) a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      document.getElementById('gm').addEventListener('click', () => {
        window.GM_download(
          'http://127.0.0.1:18999/big.bin',
          'gm-download-test.bin'
        );
      });

      document.getElementById('anchor').addEventListener('click', () => {
        log('<a download> 点击');
        const a = document.createElement('a');
        a.href = 'http://127.0.0.1:18999/big.bin';
        a.download = 'anchor-download-test.bin';
        document.body.appendChild(a);
        a.click();
        a.remove();
      });

      log('页面已就绪');
    </script>
  </body>
</html>
